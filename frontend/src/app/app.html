<main class="layout-shell">
  <header class="app-header">
    <div class="brand">
      <h1>Java + Angular Demo</h1>
      <p>Route-based user browsing with service-driven API calls.</p>
    </div>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/users" routerLinkActive="active">Users</a>
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <span *ngIf="currentUser()" class="auth-badge">
        {{ currentUser()?.name }} ({{ currentUser()?.role }})
      </span>
    </nav>
  </header>

  <section class="view-frame">
    <router-outlet></router-outlet>
  </section>
</main>

<style>
  :host {
    display: block;
    min-height: 100vh;
    font-family: Inter, system-ui, sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }

  .layout-shell {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding: 1.5rem;
  }

  .app-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 1rem;
    align-items: center;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 1rem;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.75rem;
  }

  .brand p {
    margin: 0.35rem 0 0;
    color: #475569;
  }

  nav {
    display: flex;
    gap: 0.75rem;
  }

  nav a {
    padding: 0.65rem 1rem;
    border-radius: 0.75rem;
    text-decoration: none;
    color: #1e293b;
    background: #e2e8f0;
    transition: background 0.2s ease;
  }

  nav a.active,
  nav a:hover {
    background: #2563eb;
    color: #ffffff;
  }

  .view-frame {
    padding: 1rem 0;
  }
</style>
